name: wp-dev-env

services:
  # Single entry point on host port 80; routes by host name (docker/traefik/dynamic.yml).
  traefik:
    image: traefik:v3
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --ping=true
    ports:
      - "${HTTP_PORT:?}:80"
    networks:
      default:
        # Containers such as e2e reach WordPress at WP_URL through Traefik.
        aliases:
          - ${WP_HOST:?}
          - ${WP_RELEASE_HOST:?}
    environment:
      WP_HOST: ${WP_HOST:?}
      WP_RELEASE_HOST: ${WP_RELEASE_HOST:?}
      MAILPIT_HOST: ${MAILPIT_HOST:?}
      TRAEFIK_HOST: ${TRAEFIK_HOST:?}
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    image: mariadb:lts
    # Runs as the host user so data/db stays owned (and removable) by the host user.
    user: "${HOST_UID:?}:${HOST_GID:?}"
    environment:
      MARIADB_DATABASE: ${DB_NAME:?}
      MARIADB_USER: ${DB_USER:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    build:
      context: docker/wordpress
      args:
        HOST_UID: ${HOST_UID:?}
        HOST_GID: ${HOST_GID:?}
    depends_on:
      db:
        condition: service_healthy
      # Only with the profile objectcache (scripts/setup enables it when WP_OBJECT_CACHE is set).
      valkey:
        condition: service_healthy
        required: false
    # Loopback requests (WP-Cron, Site Health) to WP_URL stay inside the container.
    extra_hosts:
      - "${WP_HOST:?}:127.0.0.1"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:?}
      WORDPRESS_DB_USER: ${DB_USER:?}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_URL:?}');
        define('WP_SITEURL', '${WP_URL:?}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', '/dev/stderr');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_REDIS_HOST', 'valkey');
      XDEBUG_MODE: ${XDEBUG_MODE:?}
      # Persistent object cache: empty (none) or valkey (drop-in installed by the entrypoint).
      WP_OBJECT_CACHE: ${WP_OBJECT_CACHE?}
      WP_REDIS_HOST: valkey
      # Projects in the workspace that the entrypoint links into wp-content.
      WP_THEMES: ${WP_THEMES?}
      WP_PLUGINS: ${WP_PLUGINS?}
    # The WordPress core is never persisted: the image declares VOLUME /var/www/html,
    # and Compose would carry that anonymous volume (and thus an outdated core) over
    # to recreated containers. A tmpfs forces a fresh copy from the image on every start.
    tmpfs:
      - /var/www/html:mode=0755
    volumes:
      # The workspace is read-only here; write attempts by project code fail immediately.
      - ${WORKSPACE_DIR:?}:/workspace:ro
      - ./data/uploads:/var/www/html/wp-content/uploads

  # Release test (profile release, scripts/release-test): plain WordPress without
  # workspace mounts; a release ZIP is installed with WP-CLI. Nothing is persisted.
  db-release:
    image: mariadb:lts
    profiles: [release]
    environment:
      MARIADB_DATABASE: ${DB_NAME:?}
      MARIADB_USER: ${DB_USER:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress-release:
    build:
      context: docker/wordpress
      args:
        HOST_UID: ${HOST_UID:?}
        HOST_GID: ${HOST_GID:?}
    profiles: [release]
    depends_on:
      db-release:
        condition: service_healthy
    extra_hosts:
      - "${WP_RELEASE_HOST:?}:127.0.0.1"
    environment:
      WORDPRESS_DB_HOST: db-release
      WORDPRESS_DB_NAME: ${DB_NAME:?}
      WORDPRESS_DB_USER: ${DB_USER:?}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?}
      # Same debug settings as development, so browser tests see the same error details.
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_RELEASE_URL:?}');
        define('WP_SITEURL', '${WP_RELEASE_URL:?}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', '/dev/stderr');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
      XDEBUG_MODE: "off"
      # No workspace projects: the release ZIP is installed instead.
      WP_THEMES: ""
      WP_PLUGINS: ""
      # No persistent object cache: the release test runs against plain WordPress.
      WP_OBJECT_CACHE: ""
    tmpfs:
      - /var/www/html:mode=0755
    volumes:
      # Release ZIPs to install (scripts/release-test copies them here).
      - ./data/release:/release:ro

  tools:
    build: docker/tools
    profiles: [tools]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    volumes:
      - ${WORKSPACE_DIR:?}:/workspace
      - tools-cache:/cache

  mail:
    image: axllent/mailpit:latest

  # Persistent object cache (profile objectcache) for WP_OBJECT_CACHE=valkey; nothing is persisted.
  valkey:
    image: valkey/valkey:9.1-alpine
    profiles: [objectcache]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Browser tests of the projects (Playwright), e.g.
  # docker compose run --rm e2e npm --prefix /workspace/<project> run test:e2e
  e2e:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:?}-noble
    profiles: [e2e]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    depends_on:
      - traefik
      - wordpress
    environment:
      HOME: /tmp
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?}
      WP_BASE_URL: ${WP_URL:?}
      WP_USERNAME: ${WP_ADMIN_USER:?}
      WP_PASSWORD: ${WP_ADMIN_PASSWORD:?}
      # Browsers resolve *.localhost to the loopback address themselves; send WP_HOST to Traefik.
      E2E_BROWSER_HOST_RULES: MAP ${WP_HOST:?} traefik
      # dev or release: which site the tests run against. For the release test, override
      # WP_BASE_URL, E2E_BROWSER_HOST_RULES and E2E_TARGET (see README).
      E2E_TARGET: dev
      # The workspace is read-only; test results and login state go here (data/e2e on the host).
      E2E_OUTPUT_DIR: /results
    volumes:
      - ${WORKSPACE_DIR:?}:/workspace:ro
      - ./data/e2e:/results

volumes:
  tools-cache:
