name: wp-dev-env

services:
  # Single entry point on host port 80; routes by host name (docker/traefik/dynamic.yml).
  traefik:
    image: traefik:v3
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --ping=true
    ports:
      - "${HTTP_PORT:?}:80"
    environment:
      WP_HOST: ${WP_HOST:?}
      MAILPIT_HOST: ${MAILPIT_HOST:?}
      TRAEFIK_HOST: ${TRAEFIK_HOST:?}
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    image: mariadb:lts
    # Runs as the host user so data/db stays owned (and removable) by the host user.
    user: "${HOST_UID:?}:${HOST_GID:?}"
    environment:
      MARIADB_DATABASE: ${DB_NAME:?}
      MARIADB_USER: ${DB_USER:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./data/sites/${WP_SITE:?}/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    build:
      context: docker/wordpress
      args:
        HOST_UID: ${HOST_UID:?}
        HOST_GID: ${HOST_GID:?}
    depends_on:
      db:
        condition: service_healthy
      # Only with the profile objectcache (scripts/setup enables it when WP_OBJECT_CACHE is set).
      valkey:
        condition: service_healthy
        required: false
    # WP-CLI finds the installation here (a Bedrock site repository brings its wp-cli.yml).
    working_dir: ${WP_WORKDIR:?}
    # Loopback requests (WP-Cron, Site Health) to WP_URL stay inside the container.
    extra_hosts:
      - "${WP_HOST:?}:127.0.0.1"
    environment:
      # Site type (scripts/setup derives the paths): vanilla runs the image's core in
      # /var/www/html, bedrock the site repository with its own core and configuration.
      WP_SITE_TYPE: ${WP_SITE_TYPE:?}
      APACHE_DOCUMENT_ROOT: ${WP_DOCROOT:?}
      WP_CORE_PATH: ${WP_CORE_PATH?}
      WP_UPLOADS_DIR: ${WP_UPLOADS_DIR:?}
      # Configuration of the official image (vanilla).
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:?}
      WORDPRESS_DB_USER: ${DB_USER:?}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:?}
      WORDPRESS_AUTH_KEY: ${AUTH_KEY:?}
      WORDPRESS_SECURE_AUTH_KEY: ${SECURE_AUTH_KEY:?}
      WORDPRESS_LOGGED_IN_KEY: ${LOGGED_IN_KEY:?}
      WORDPRESS_NONCE_KEY: ${NONCE_KEY:?}
      WORDPRESS_AUTH_SALT: ${AUTH_SALT:?}
      WORDPRESS_SECURE_AUTH_SALT: ${SECURE_AUTH_SALT:?}
      WORDPRESS_LOGGED_IN_SALT: ${LOGGED_IN_SALT:?}
      WORDPRESS_NONCE_SALT: ${NONCE_SALT:?}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_URL:?}');
        define('WP_SITEURL', '${WP_URL:?}');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', '/dev/stderr');
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('WP_REDIS_HOST', 'valkey');
        define('DISABLE_WP_CRON', (bool) ${WP_DISABLE_CRON:?});
      # Configuration of Bedrock (config/application.php reads environment variables).
      DB_HOST: db
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_PREFIX: ${WP_TABLE_PREFIX:?}
      WP_ENV: development
      WP_ENVIRONMENT_TYPE: local
      WP_HOME: ${WP_URL:?}
      WP_SITEURL: ${WP_SITEURL:?}
      WP_DEBUG_LOG: /dev/stderr
      DISABLE_WP_CRON: ${WP_DISABLE_CRON:?}
      AUTH_KEY: ${AUTH_KEY:?}
      SECURE_AUTH_KEY: ${SECURE_AUTH_KEY:?}
      LOGGED_IN_KEY: ${LOGGED_IN_KEY:?}
      NONCE_KEY: ${NONCE_KEY:?}
      AUTH_SALT: ${AUTH_SALT:?}
      SECURE_AUTH_SALT: ${SECURE_AUTH_SALT:?}
      LOGGED_IN_SALT: ${LOGGED_IN_SALT:?}
      NONCE_SALT: ${NONCE_SALT:?}
      XDEBUG_MODE: ${XDEBUG_MODE:?}
      # Persistent object cache: empty (none) or valkey (drop-in installed by the entrypoint).
      WP_OBJECT_CACHE: ${WP_OBJECT_CACHE?}
      WP_REDIS_HOST: valkey
      # Live site of imported data (may be empty); the entrypoint redirects missing uploads there.
      WP_LIVE_URL: ${WP_LIVE_URL?}
      # Projects (paths relative to the workspace) that the entrypoint links into wp-content (vanilla).
      WP_THEMES: ${WP_THEMES?}
      WP_PLUGINS: ${WP_PLUGINS?}
    # The WordPress core is never persisted: the image declares VOLUME /var/www/html,
    # and Compose would carry that anonymous volume (and thus an outdated core) over
    # to recreated containers. A tmpfs forces a fresh copy from the image on every start.
    tmpfs:
      - /var/www/html:mode=0755
    volumes:
      # The workspace is read-only here; write attempts by project code fail immediately.
      - ${WORKSPACE_DIR:?}:/workspace:ro
      # Mounted inside the workspace for a Bedrock site (web/app/uploads, web/app/cache);
      # scripts/setup creates the mount points.
      - ./data/sites/${WP_SITE:?}/uploads:${WP_UPLOADS_DIR:?}
      - ./data/sites/${WP_SITE:?}/cache:${WP_CACHE_DIR:?}

  tools:
    build: docker/tools
    profiles: [tools]
    user: "${HOST_UID:?}:${HOST_GID:?}"
    volumes:
      - ${WORKSPACE_DIR:?}:/workspace
      - tools-cache:/cache

  mail:
    image: axllent/mailpit:latest

  # Persistent object cache (profile objectcache) for WP_OBJECT_CACHE=valkey; nothing is persisted.
  valkey:
    image: valkey/valkey:9.1-alpine
    profiles: [objectcache]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  tools-cache:
